# Restore traditional terminal color behavior in tmux 3.8+ by disabling the new builtin theme
# override, ensuring .Xresources colors are used correctly.
set -s theme terminal

set -g default-command bash
set -g mouse on

# Use Nord's dark grey (colour8) for selection mode to replace the hard-to-read default yellow,
# matching Emacs' Nord theme style.
set -g mode-style "bg=colour8"

set -g status-justify "centre"
set -g status-right "%H:%M %a %d-%b"

set -g prefix C-j
unbind C-b

bind -N "Record .tmux.conf" r \
  source-file ~/.tmux.conf \; display-message "Reloaded .tmux.conf"
bind C-j send-prefix

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOME/.tmux/plugins/tpm/tpm'
